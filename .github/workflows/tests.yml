# Test suite on every push and pull request (M0 T2, SEC-09).
#
#   pytest                full suite, Windows + Linux, Python 3.12, editable
#                         install with the dev extras (the dev-box setup)
#   connector-standalone  `pip install .` with no extras, then only the
#                         connector (Class C) tests: the OSS connector must
#                         work without anything the legacy code pulled in
#
# Each run uploads its JUnit XML. junit_gate.py fails on any failure or error
# and writes the counts to the job summary; counts are recorded, not pinned,
# so new tests never break CI. Frozen gate numbers live in
# docs/control-plane/M0_BASELINE.md. The per-test 30 s timeout comes from
# pyproject.toml ([tool.pytest.ini_options] timeout = 30); it is not overridden.
# Tests must not write into the checkout: the last step fails on any stray or
# modified file (T11: a spawner once wrote Windows cache DBs into the repo).
name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  pytest:
    name: pytest (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        include:
          # Windows-path tests, POSIX variant pending (A): they hard-code
          # C:\... paths, which on POSIX are relative names inside the folder.
          # Linux only; Windows runs them with no deselection. Task T12.
          - os: ubuntu-latest
            deselect: >-
              --deselect tests/unit/test_classify.py::test_write_outside_folder_denied_by_default
              --deselect tests/unit/test_classify.py::test_read_outside_folder_observed
              --deselect tests/unit/test_hook_eval_m4.py::test_read_outside_is_observed_not_blocked
              --deselect tests/unit/test_hook_eval_m4.py::test_write_outside_denied_with_pointer
              --deselect tests/unit/test_hook_eval_m4.py::test_risk_upgrades_sensitive_read_from_observe_to_escalate
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Install (editable, dev extras)
        # defusedxml: junit_gate.py parses the JUnit XML (semgrep use-defused-xml-parse).
        run: python -m pip install --quiet -e ".[dev]" "defusedxml>=0.7.1"
      - name: Dependency-free CPython for SEC-27/28 (M2 T1)
        # Embeddable CPython 3.12.10 amd64 from python.org, pinned by sha256.
        # Source: https://www.python.org/ftp/python/3.12.10/
        # The ci_bare_python pytest plugin (.github/scripts/) wires BARE_PYTHON
        # to sys._base_executable before collection so the 3 needs_bare_python
        # tests run instead of skipping.
        if: runner.os == 'Windows'
        run: |
          curl -fsSL -o "$RUNNER_TEMP/cpython-embed.zip" \
            "https://www.python.org/ftp/python/3.12.10/python-3.12.10-embed-amd64.zip"
          echo "4acbed6dd1c744b0376e3b1cf57ce906f9dc9e95e68824584c8099a63025a3c3  $RUNNER_TEMP/cpython-embed.zip" \
            | sha256sum -c
          unzip -q "$RUNNER_TEMP/cpython-embed.zip" -d "$RUNNER_TEMP/cpython-embed"
          rm "$RUNNER_TEMP/cpython-embed/python312._pth"
          "$RUNNER_TEMP/cpython-embed/python.exe" --version
      - name: Run the suite
        env:
          BARE_PYTHON: ${{ runner.os == 'Windows' && format('{0}/cpython-embed/python.exe', runner.temp) || '' }}
        run: >
          PYTHONPATH=".github/scripts${PYTHONPATH:+:$PYTHONPATH}"
          python -m pytest -q -p no:logging -p ci_bare_python
          ${{ matrix.deselect }}
          --junitxml "$RUNNER_TEMP/junit-pytest-${{ runner.os }}.xml"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: success() || failure()
        with:
          name: junit-pytest-${{ runner.os }}
          path: ${{ runner.temp }}/junit-pytest-${{ runner.os }}.xml
      - name: Gate (no failures or errors; counts to summary)
        if: success() || failure()
        run: python .github/scripts/junit_gate.py "$RUNNER_TEMP/junit-pytest-${{ runner.os }}.xml" --label "pytest ${{ runner.os }}" --min-tests 500
      - name: Frozen test files unchanged (M3_FROZEN_MANIFEST.sha256)
        # All 203 entries in the manifest (tests/, ee/tests/, ee/web/tests/
        # and named files).  Hashes are of LF content; Linux checkout is LF.
        if: runner.os == 'Linux'
        run: sha256sum -c docs/control-plane/M3_FROZEN_MANIFEST.sha256 --quiet
      - name: No stray files in the checkout
        if: success() || failure()
        run: |
          stray=$(git status --porcelain --untracked-files=all)
          if [ -n "$stray" ]; then echo "Tests left files in the repo:"; echo "$stray"; exit 1; fi

  ee:
    # 3.12 is the dev/test baseline; 3.15 is what the Chainguard api image
    # runs (M2 T4; founder, 22 Oct 2026: test the runtime Python too).
    name: ee control plane (py${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.15"]
    services:
      postgres:
        image: postgres:16@sha256:ca0bd484cb98bf4b24eb1010e73fb3fcbd6714d240fbc1a10eea5b7dbecb641d
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      - name: Install root package and ee with dev extras
        run: |
          python -m pip install --quiet .
          python -m pip install --quiet -e "./ee[dev]" "defusedxml>=0.7.1"  # editable: coverage measures ee/src/agg_cp (gate item 2)
      - name: lint-imports (import-linter contract)
        run: lint-imports --config ee/.importlinter
      - name: Frozen ee test files unchanged (M3_FROZEN_MANIFEST.sha256)
        # The ee/ half of the M3 manifest (connector-standalone checks non-ee).
        # M3 T0a: no named exceptions; all ee files checked at HEAD hashes.
        # Hashes are of LF content; only the Linux checkout is LF on disk.
        if: runner.os == 'Linux'
        run: >
          grep '  ee/' docs/control-plane/M3_FROZEN_MANIFEST.sha256
          | sha256sum -c --quiet
      - name: EE node-id equality (M3_BASELINE_EE_NODEIDS.txt)
        # Collect-only must match the frozen ee node-id list exactly.
        # Run on py3.12 only (the baseline was generated with 3.12).
        if: matrix.python == '3.12'
        run: |
          python -m pytest -q --collect-only -p no:logging ee/tests/ 2>/dev/null \
            | grep "::" | sort > "$RUNNER_TEMP/ee_collected.txt"
          sort docs/control-plane/M3_BASELINE_EE_NODEIDS.txt > "$RUNNER_TEMP/ee_expected.txt"
          diff "$RUNNER_TEMP/ee_expected.txt" "$RUNNER_TEMP/ee_collected.txt"
      - name: Run ee tests (branch coverage; M1 gate item 2 needs >= 85%)
        env:
          AGG_TEST_PG_URL: postgresql://postgres@localhost:5432/postgres
          COVERAGE_FILE: ${{ runner.temp }}/.coverage
          COVERAGE_PROCESS_START: ee/pyproject.toml
        run: python -m coverage run --rcfile=ee/pyproject.toml -m pytest -q ee/tests --junitxml "$RUNNER_TEMP/junit-ee.xml"
      - name: Drop unfinished subprocess coverage files
        # A worker SIGKILLed mid-write leaves a zero-byte or schema-less
        # .coverage.* file; coverage 7.16 opens them read-only on combine
        # and fails with "no such table: coverage_schema".  Remove only
        # those and warn loudly so the lost data is visible in the run.
        run: |
          python - <<'EOF'
          import glob, os, sqlite3
          root = os.environ["RUNNER_TEMP"]
          files = sorted(glob.glob(os.path.join(root, ".coverage.*")))
          print(f"{len(files)} subprocess coverage file(s) in {root}")
          bad = []
          for f in files:
              size = os.path.getsize(f)
              reason = None
              if size == 0:
                  reason = "zero bytes"
              else:
                  try:
                      con = sqlite3.connect(f"file:{f}?mode=ro", uri=True)
                      try:
                          n = con.execute(
                              "select count(*) from sqlite_master"
                              " where type='table' and name='coverage_schema'"
                          ).fetchone()[0]
                      finally:
                          con.close()
                      if n == 0:
                          reason = "no coverage_schema table"
                  except sqlite3.DatabaseError as e:
                      reason = f"sqlite error: {e}"
              print(f"  {os.path.basename(f)}  {size} bytes  {reason or 'ok'}")
              if reason:
                  bad.append((f, reason))
          for f, reason in bad:
              os.remove(f)
              print(f"::warning::Deleted unfinished coverage data file {os.path.basename(f)} ({reason}); its coverage is lost")
          print(f"deleted {len(bad)} file(s)")
          EOF
      - name: Combine subprocess coverage
        env:
          COVERAGE_FILE: ${{ runner.temp }}/.coverage
        run: python -m coverage combine --rcfile=ee/pyproject.toml
      - name: Coverage gate (fail under 85%, no omit list)
        env:
          COVERAGE_FILE: ${{ runner.temp }}/.coverage
        run: python -m coverage report --rcfile=ee/pyproject.toml --fail-under=85 | tail -1 | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: success() || failure()
        with:
          name: junit-ee-py${{ matrix.python }}
          path: ${{ runner.temp }}/junit-ee.xml
      - name: Gate (no failures or errors)
        if: success() || failure()
        run: python .github/scripts/junit_gate.py "$RUNNER_TEMP/junit-ee.xml" --label "ee" --min-tests 5
      - name: No stray files in the checkout
        if: success() || failure()
        run: |
          stray=$(git status --porcelain --untracked-files=all)
          if [ -n "$stray" ]; then echo "Tests left files in the repo:"; echo "$stray"; exit 1; fi

  ee-windows:
    name: ee control plane (Windows)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Install root package and ee with dev extras
        run: |
          python -m pip install --quiet .
          python -m pip install --quiet -e "./ee[dev]" "defusedxml>=0.7.1"
      - name: Run ee non-pg tests
        run: >
          python -m pytest -q -p no:logging -m "not pg" ee/tests
          --junitxml "$RUNNER_TEMP/junit-ee-windows.xml"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: success() || failure()
        with:
          name: junit-ee-Windows
          path: ${{ runner.temp }}/junit-ee-windows.xml
      - name: Gate (no failures or errors)
        if: success() || failure()
        run: python .github/scripts/junit_gate.py "$RUNNER_TEMP/junit-ee-windows.xml" --label "ee Windows" --min-tests 5
      - name: No stray files in the checkout
        if: success() || failure()
        run: |
          stray=$(git status --porcelain --untracked-files=all)
          if [ -n "$stray" ]; then echo "Tests left files in the repo:"; echo "$stray"; exit 1; fi

  connector-standalone:
    name: connector standalone (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        include:
          # Windows-path tests, POSIX variant pending (A): they hard-code
          # C:\... paths, which on POSIX are relative names inside the folder.
          # Linux only; Windows runs them with no deselection. Task T12.
          - os: ubuntu-latest
            deselect: >-
              --deselect tests/unit/test_classify.py::test_write_outside_folder_denied_by_default
              --deselect tests/unit/test_classify.py::test_read_outside_folder_observed
              --deselect tests/unit/test_hook_eval_m4.py::test_read_outside_is_observed_not_blocked
              --deselect tests/unit/test_hook_eval_m4.py::test_write_outside_denied_with_pointer
              --deselect tests/unit/test_hook_eval_m4.py::test_risk_upgrades_sensitive_read_from_observe_to_escalate
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Remove ee/ to prove connector works standalone
        run: rm -rf ee
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Install the package (no extras) and only the test runner
        # Test runner versions match the [dev] extra in pyproject.toml.
        run: |
          python -m pip install --quiet .
          python -m pip install --quiet "pytest>=8.3.0" "pytest-asyncio>=0.24.0" "pytest-timeout>=2.3.0" "defusedxml>=0.7.1"
      - name: Dependency-free CPython for SEC-27/28 (M2 T1)
        if: runner.os == 'Windows'
        run: |
          curl -fsSL -o "$RUNNER_TEMP/cpython-embed.zip" \
            "https://www.python.org/ftp/python/3.12.10/python-3.12.10-embed-amd64.zip"
          echo "4acbed6dd1c744b0376e3b1cf57ce906f9dc9e95e68824584c8099a63025a3c3  $RUNNER_TEMP/cpython-embed.zip" \
            | sha256sum -c
          unzip -q "$RUNNER_TEMP/cpython-embed.zip" -d "$RUNNER_TEMP/cpython-embed"
          rm "$RUNNER_TEMP/cpython-embed/python312._pth"
          "$RUNNER_TEMP/cpython-embed/python.exe" --version
      - name: Frozen test files unchanged (M3_FROZEN_MANIFEST.sha256)
        # The non-ee/ half of the M3 manifest.  This job removes ee/, so only
        # the tests/ and named-file entries are checked.  M3 T0a: no named
        # exceptions.  Hashes are of LF content; Linux checkout is LF on disk.
        if: runner.os == 'Linux'
        run: grep -v '  ee/' docs/control-plane/M3_FROZEN_MANIFEST.sha256 | sha256sum -c --quiet
      - name: Run the connector (Class C) tests
        env:
          BARE_PYTHON: ${{ runner.os == 'Windows' && format('{0}/cpython-embed/python.exe', runner.temp) || '' }}
        run: |
          python .github/scripts/c_tests.py > "$RUNNER_TEMP/c_tests.txt"
          echo "$(wc -l < "$RUNNER_TEMP/c_tests.txt") test files"
          PYTHONPATH=".github/scripts${PYTHONPATH:+:$PYTHONPATH}" \
            python -m pytest -q -p no:logging -p ci_bare_python \
            ${{ matrix.deselect }} \
            --junitxml "$RUNNER_TEMP/junit-connector-${{ runner.os }}.xml" \
            $(cat "$RUNNER_TEMP/c_tests.txt")
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: success() || failure()
        with:
          name: junit-connector-${{ runner.os }}
          path: ${{ runner.temp }}/junit-connector-${{ runner.os }}.xml
      - name: Gate (no failures or errors; counts to summary)
        if: success() || failure()
        run: python .github/scripts/junit_gate.py "$RUNNER_TEMP/junit-connector-${{ runner.os }}.xml" --label "connector ${{ runner.os }}" --min-tests 400
      - name: No stray files in the checkout
        if: success() || failure()
        run: |
          stray=$(git status --porcelain --untracked-files=all -- . ":(exclude)ee")
          if [ -n "$stray" ]; then echo "Tests left files in the repo:"; echo "$stray"; exit 1; fi

  ee-web:
    name: ee web (lint, build, test)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ee/web/package-lock.json
      - name: Install dependencies
        working-directory: ee/web
        run: npm ci
      - name: Lint
        working-directory: ee/web
        run: npm run lint
      - name: Build (tsc + vite + CSP check)
        working-directory: ee/web
        run: npm run build
      - name: Frozen ee/web test files unchanged (M3_FROZEN_MANIFEST.sha256)
        # The ee/web/ half of the M3 manifest.  Hashes are of LF content;
        # only the Linux checkout is LF on disk.
        run: >
          grep '  ee/web/' docs/control-plane/M3_FROZEN_MANIFEST.sha256
          | sha256sum -c --quiet
      - name: Test (vitest)
        working-directory: ee/web
        run: npm test
      - name: Web node-id equality (M3_BASELINE_WEB_NODEIDS.txt)
        # Collect vitest test names and diff against the frozen web node-id list.
        # Uses --reporter=json --outputFile to get structured test names (vitest
        # 5.x writes JSON to a file, not stdout), then formats them as
        # "ee/web/tests/<file>::<describe> <name>" to match the frozen list.
        run: |
          cd ee/web
          npx vitest run --reporter=json --outputFile="$RUNNER_TEMP/vitest.json"
          node -e '
            const fs = require("fs");
            const data = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/vitest.json", "utf8"));
            const ids = [];
            for (const file of data.testResults || []) {
              const rel = file.name.replace(/.*ee\/web\//, "ee/web/");
              for (const suite of file.assertionResults || []) {
                const ancestors = suite.ancestorTitles || [];
                const name = [...ancestors, suite.title].join(" ");
                ids.push(rel + "::" + name);
              }
            }
            ids.sort();
            for (const id of ids) console.log(id);
          ' > "$RUNNER_TEMP/web_collected.txt"
          cd "$GITHUB_WORKSPACE"
          sort docs/control-plane/M3_BASELINE_WEB_NODEIDS.txt > "$RUNNER_TEMP/web_expected.txt"
          diff "$RUNNER_TEMP/web_expected.txt" "$RUNNER_TEMP/web_collected.txt"
      - name: No stray files in the checkout
        if: success() || failure()
        run: |
          stray=$(git status --porcelain --untracked-files=all)
          if [ -n "$stray" ]; then echo "Tests left files in the repo:"; echo "$stray"; exit 1; fi
