# Test suite on every push and pull request (M0 T2, SEC-09).
#
#   pytest                full suite, Windows + Linux, Python 3.12, editable
#                         install with the dev extras (the dev-box setup)
#   connector-standalone  `pip install .` with no extras, then only the
#                         connector (Class C) tests: the OSS connector must
#                         work without anything the legacy code pulled in
#
# Each run uploads its JUnit XML. junit_gate.py fails on any failure or error
# and writes the counts to the job summary; counts are recorded, not pinned,
# so new tests never break CI. Frozen gate numbers live in
# docs/control-plane/M0_BASELINE.md. The per-test 30 s timeout comes from
# pyproject.toml ([tool.pytest.ini_options] timeout = 30); it is not overridden.
# Tests must not write into the checkout: the last step fails on any stray or
# modified file (T11: a spawner once wrote Windows cache DBs into the repo).
name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  pytest:
    name: pytest (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        include:
          # Windows-path tests, POSIX variant pending (A): they hard-code
          # C:\... paths, which on POSIX are relative names inside the folder.
          # Linux only; Windows runs them with no deselection. Task T12.
          - os: ubuntu-latest
            deselect: >-
              --deselect tests/unit/test_classify.py::test_write_outside_folder_denied_by_default
              --deselect tests/unit/test_classify.py::test_read_outside_folder_observed
              --deselect tests/unit/test_hook_eval_m4.py::test_read_outside_is_observed_not_blocked
              --deselect tests/unit/test_hook_eval_m4.py::test_write_outside_denied_with_pointer
              --deselect tests/unit/test_hook_eval_m4.py::test_risk_upgrades_sensitive_read_from_observe_to_escalate
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Install (editable, dev extras)
        # defusedxml: junit_gate.py parses the JUnit XML (semgrep use-defused-xml-parse).
        run: python -m pip install --quiet -e ".[dev]" "defusedxml>=0.7.1"
      - name: Run the suite
        run: >
          python -m pytest -q -p no:logging
          ${{ matrix.deselect }}
          --junitxml "$RUNNER_TEMP/junit-pytest-${{ runner.os }}.xml"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: success() || failure()
        with:
          name: junit-pytest-${{ runner.os }}
          path: ${{ runner.temp }}/junit-pytest-${{ runner.os }}.xml
      - name: Gate (no failures or errors; counts to summary)
        if: success() || failure()
        run: python .github/scripts/junit_gate.py "$RUNNER_TEMP/junit-pytest-${{ runner.os }}.xml" --label "pytest ${{ runner.os }}" --min-tests 500
      - name: No stray files in the checkout
        if: success() || failure()
        run: |
          stray=$(git status --porcelain --untracked-files=all)
          if [ -n "$stray" ]; then echo "Tests left files in the repo:"; echo "$stray"; exit 1; fi

  ee:
    name: ee control plane
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16@sha256:ca0bd484cb98bf4b24eb1010e73fb3fcbd6714d240fbc1a10eea5b7dbecb641d
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Install root package and ee with dev extras
        run: |
          python -m pip install --quiet .
          python -m pip install --quiet "./ee[dev]" "defusedxml>=0.7.1"
      - name: lint-imports (import-linter contract)
        run: lint-imports --config ee/.importlinter
      - name: Run ee tests (branch coverage; M1 gate item 2 needs >= 85%)
        env:
          AGG_TEST_PG_URL: postgresql://postgres@localhost:5432/postgres
          COVERAGE_FILE: ${{ runner.temp }}/.coverage
        run: python -m coverage run --branch --source=ee/src/agg_cp -m pytest -q ee/tests --junitxml "$RUNNER_TEMP/junit-ee.xml"
      - name: Coverage gate (fail under 85%, no omit list)
        env:
          COVERAGE_FILE: ${{ runner.temp }}/.coverage
        run: python -m coverage report --fail-under=85 | tail -1 | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: success() || failure()
        with:
          name: junit-ee
          path: ${{ runner.temp }}/junit-ee.xml
      - name: Gate (no failures or errors)
        if: success() || failure()
        run: python .github/scripts/junit_gate.py "$RUNNER_TEMP/junit-ee.xml" --label "ee" --min-tests 5
      - name: No stray files in the checkout
        if: success() || failure()
        run: |
          stray=$(git status --porcelain --untracked-files=all)
          if [ -n "$stray" ]; then echo "Tests left files in the repo:"; echo "$stray"; exit 1; fi

  connector-standalone:
    name: connector standalone (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        include:
          # Windows-path tests, POSIX variant pending (A): they hard-code
          # C:\... paths, which on POSIX are relative names inside the folder.
          # Linux only; Windows runs them with no deselection. Task T12.
          - os: ubuntu-latest
            deselect: >-
              --deselect tests/unit/test_classify.py::test_write_outside_folder_denied_by_default
              --deselect tests/unit/test_classify.py::test_read_outside_folder_observed
              --deselect tests/unit/test_hook_eval_m4.py::test_read_outside_is_observed_not_blocked
              --deselect tests/unit/test_hook_eval_m4.py::test_write_outside_denied_with_pointer
              --deselect tests/unit/test_hook_eval_m4.py::test_risk_upgrades_sensitive_read_from_observe_to_escalate
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Remove ee/ to prove connector works standalone
        run: rm -rf ee
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Install the package (no extras) and only the test runner
        # Test runner versions match the [dev] extra in pyproject.toml.
        run: |
          python -m pip install --quiet .
          python -m pip install --quiet "pytest>=8.3.0" "pytest-asyncio>=0.24.0" "pytest-timeout>=2.3.0" "defusedxml>=0.7.1"
      - name: Frozen test files unchanged (M1_FROZEN_MANIFEST.sha256)
        # M1 manifest supersedes M0_C_MANIFEST (which lags the documented M1
        # re-hashes in M1_BASELINE.md). Hashes are of LF content; only the Linux
        # checkout is LF on disk.
        if: runner.os == 'Linux' && hashFiles('docs/control-plane/M1_FROZEN_MANIFEST.sha256') != ''
        run: sha256sum -c --quiet docs/control-plane/M1_FROZEN_MANIFEST.sha256
      - name: Run the connector (Class C) tests
        run: |
          python .github/scripts/c_tests.py > "$RUNNER_TEMP/c_tests.txt"
          echo "$(wc -l < "$RUNNER_TEMP/c_tests.txt") test files"
          python -m pytest -q -p no:logging ${{ matrix.deselect }} --junitxml "$RUNNER_TEMP/junit-connector-${{ runner.os }}.xml" $(cat "$RUNNER_TEMP/c_tests.txt")
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: success() || failure()
        with:
          name: junit-connector-${{ runner.os }}
          path: ${{ runner.temp }}/junit-connector-${{ runner.os }}.xml
      - name: Gate (no failures or errors; counts to summary)
        if: success() || failure()
        run: python .github/scripts/junit_gate.py "$RUNNER_TEMP/junit-connector-${{ runner.os }}.xml" --label "connector ${{ runner.os }}" --min-tests 400
      - name: No stray files in the checkout
        if: success() || failure()
        run: |
          stray=$(git status --porcelain --untracked-files=all -- . ":(exclude)ee")
          if [ -n "$stray" ]; then echo "Tests left files in the repo:"; echo "$stray"; exit 1; fi
