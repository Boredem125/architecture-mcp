[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-agent-sandbox"
version = "1.0.0"
description = "Agent Governance Gateway: authorization, dual-control approval and signed audit for AI coding agents' tool calls (OSS connector)"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "httpx>=0.27.0",
    "pynacl>=1.5.0",
    "structlog>=24.4.0",
    "orjson>=3.10.0",
    "aiofiles>=24.1.0",
    "click>=8.1.0",
    "mcp>=1.9.0,<2",
    # Not imported by us: a security floor for mcp's transitive pyjwt[crypto]
    # (mcp only needs >=2.10.1); CVE-2026-102266..102273 fixed in 2.14.0.
    "pyjwt>=2.14.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "pytest-timeout>=2.3.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

# Optional intent-aware layer: runs the local jev-os service (`jevos serve`).
semantic = ["jev-os[server] @ git+https://github.com/Boredem125/jev-os"]

[project.scripts]
sandbox = "sandbox.cli.main:cli"
sandbox-mcp = "sandbox.connector.mcp_server:main"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/sandbox"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
timeout = 30

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "S", "B", "A", "C4", "SIM", "TCH"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
