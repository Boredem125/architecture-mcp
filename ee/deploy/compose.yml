# ee/deploy/compose.yml -- Self-hosted control-plane stack (ADR 0005).
#
# Usage:
#   docker compose --profile init run --rm init-secrets   # first time only
#   docker compose up -d
#   docker compose logs migrate                           # read the setup code
#   docker compose --profile demo up -d --build           # adds Keycloak + demo bootstrap
#
# Every image is pinned by digest.  No secrets in environment variables;
# all sensitive values come from compose secrets (mounted files) and the
# *_FILE env-var convention.

# ---------------------------------------------------------------------------
# Secrets (files under ./secrets/, created by init-secrets)
# ---------------------------------------------------------------------------
secrets:
  pg_owner_password:
    file: ./secrets/pg_owner_password
  pg_app_password:
    file: ./secrets/pg_app_password
  pg_superuser_password:
    file: ./secrets/pg_superuser_password
  pg_owner_url:
    file: ./secrets/pg_owner_url
  pg_app_url:
    file: ./secrets/pg_app_url
  oidc_client_secret:
    file: ./secrets/oidc_client_secret
  server_signing_key:
    file: ./secrets/server_signing_key

# ---------------------------------------------------------------------------
# Networks
# ---------------------------------------------------------------------------
networks:
  edge:
    driver: bridge
  internal:
    driver: bridge
    internal: true
  idp:
    driver: bridge
    internal: true

# ---------------------------------------------------------------------------
# Volumes
# ---------------------------------------------------------------------------
volumes:
  pg-data:
  caddy-data:
  caddy-config:
  ca-bundle:

# ---------------------------------------------------------------------------
# Services
# ---------------------------------------------------------------------------
services:

  # --- init-secrets (one-shot, profile "init") ----------------------------
  init-secrets:
    profiles: ["init"]
    image: python:3.12-slim@sha256:a6e34c598f2467ed0e9a8d349809fcd8b5c603269512df273a0bb1784edc11b1  # python:3.12-slim
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN         # fchown each secret file to its consumer uid/gid
      - DAC_OVERRIDE  # create files in ./secrets/ owned by non-root uid on Linux
    user: "0:0"  # root required for CAP_CHOWN on bind mounts; one-shot only
    volumes:
      - ./init-secrets.sh:/opt/init-secrets.sh:ro
      - ./secrets:/opt/secrets
    entrypoint: ["python3", "/opt/init-secrets.sh"]

  # --- postgres -----------------------------------------------------------
  postgres:
    image: postgres:16@sha256:ca0bd484cb98bf4b24eb1010e73fb3fcbd6714d240fbc1a10eea5b7dbecb641d  # postgres:16
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=64m
      - /run/postgresql:noexec,nosuid,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # No cap_add: running as uid 999 from the start, so the entrypoint
    # never needs setuid/chown.  Needs Docker verification.
    user: "999:999"  # default postgres uid/gid inside the image
    networks:
      - internal
    # No published ports -- only reachable on the internal network.
    environment:
      POSTGRES_DB: agg
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_superuser_password
    secrets:
      - pg_superuser_password
      - pg_owner_password
      - pg_app_password
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./init/00-roles.sh:/docker-entrypoint-initdb.d/00-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d agg"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # --- migrate (one-shot) -------------------------------------------------
  migrate:
    build:
      context: ../..
      dockerfile: ee/deploy/api.Dockerfile
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    user: "10001:10001"
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy
    secrets:
      - pg_owner_url
    environment:
      # migrate connects as agg_owner
      AGG_DATABASE_URL_FILE: /run/secrets/pg_owner_url
    entrypoint: ["python", "-m", "agg_cp.migrate"]
    command: []

  # --- migrate-demo (one-shot, demo profile) ------------------------------
  # Bootstraps the "acme" org with OIDC config pointing at the Keycloak
  # demo realm, then emits a one-time setup code on stdout.
  migrate-demo:
    profiles: ["demo"]
    build:
      context: ../..
      dockerfile: ee/deploy/api.Dockerfile
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    user: "10001:10001"
    networks:
      - internal
    depends_on:
      migrate:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy
    secrets:
      - pg_owner_url
    environment:
      AGG_DATABASE_URL_FILE: /run/secrets/pg_owner_url
      AGG_BOOTSTRAP_ORG_SLUG: acme
      AGG_BOOTSTRAP_ORG_NAME: "Acme Corp"
      AGG_BOOTSTRAP_ORG_ISSUER: "https://idp.localhost/realms/acme"
      AGG_BOOTSTRAP_ORG_CLIENT_ID: agg-control-plane
    entrypoint: ["python", "-m", "agg_cp.migrate"]
    command: []

  # --- ca-bundle (one-shot) -----------------------------------------------
  # Builds a combined CA bundle that includes the system CAs plus Caddy's
  # internal root CA.  The api reads SSL_CERT_FILE from the output volume
  # so that httpx trusts Caddy-issued certificates (idp.localhost demo).
  ca-bundle:
    image: python:3.12-slim@sha256:a6e34c598f2467ed0e9a8d349809fcd8b5c603269512df273a0bb1784edc11b1  # python:3.12-slim
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - DAC_READ_SEARCH  # read caddy's root CA (owned 65532, mode 0600)
    user: "0:0"  # needs write access to the ca-bundle volume
    networks:
      - internal
    depends_on:
      proxy:
        condition: service_healthy
    volumes:
      - caddy-data:/caddy-data:ro
      - ca-bundle:/out
    entrypoint:
      - sh
      - -c
      - |
        cat /etc/ssl/certs/ca-certificates.crt \
            /caddy-data/caddy/pki/authorities/local/root.crt \
            > /out/ca-certificates.crt

  # --- api ----------------------------------------------------------------
  api:
    build:
      context: ../..
      dockerfile: ee/deploy/api.Dockerfile
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    user: "10001:10001"
    group_add:
      - "30000"  # shared gid for oidc_client_secret (also used by keycloak)
    networks:
      - internal
      - edge
      - idp
    depends_on:
      migrate:
        condition: service_completed_successfully
      ca-bundle:
        condition: service_completed_successfully
    secrets:
      - pg_app_url
      - oidc_client_secret
      - server_signing_key
    volumes:
      - ca-bundle:/ca-bundle:ro
      # Mount the OIDC client secret as /oidc-secrets/<org-slug> for auth.py
      - ./secrets/oidc_client_secret:/oidc-secrets/acme:ro
      - ./secrets/oidc_client_secret:/oidc-secrets/globex:ro
    environment:
      # api connects as agg_app (no BYPASSRLS)
      AGG_DATABASE_URL_FILE: /run/secrets/pg_app_url
      AGG_PUBLIC_URL: "${AGG_PUBLIC_URL:-https://localhost}"
      AGG_OIDC_SECRETS_DIR: /oidc-secrets
      AGG_OIDC_ALLOW_HOSTS: "${AGG_OIDC_ALLOW_HOSTS:-}"
      SSL_CERT_FILE: /ca-bundle/ca-certificates.crt
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # --- proxy (Caddy) ------------------------------------------------------
  proxy:
    image: caddy:2@sha256:685ae3d7c34d9b5f8caeddc5d14051db7bbd88ff1f5a2fa0c16bd8ca328fb7af  # caddy:2
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE  # caddy binary has file cap; required in bounding set for exec
    user: "65532:65532"  # nonroot
    ports:
      - "127.0.0.1:443:8443"
      - "127.0.0.1:80:8080"
    networks:
      edge:
      idp:
        aliases:
          - idp.localhost
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
      # Mount the built web bundle (ee/web/dist or similar)
      - ../web/dist:/srv/web:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sfk https://localhost:8443/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

  # --- Keycloak (demo profile) --------------------------------------------
  # Uses a tiny demo Dockerfile (ee/deploy/keycloak/Dockerfile) that runs
  # `kc.sh build` at image build time so the runtime can use
  # `start --optimized` with read_only: true.
  keycloak:
    profiles: ["demo"]
    build:
      context: ./keycloak
      dockerfile: Dockerfile
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=128m
      # Keycloak writes to /opt/keycloak/data at runtime (H2 dev-file DB)
      - /opt/keycloak/data:noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    user: "1000:0"  # keycloak uid; gid 0 matches the image (files are keycloak:root)
    group_add:
      - "30000"  # shared gid for oidc_client_secret (also used by api)
    networks:
      - idp  # reachable by proxy for reverse_proxy keycloak:8080
    secrets:
      - oidc_client_secret
    environment:
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_ENABLED: "true"
      KC_HTTP_PORT: "8080"
      # Keycloak 26 proxy headers: trust X-Forwarded-* from Caddy
      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME: "https://idp.localhost"
      # Demo-only admin credentials -- NOT for production.
      # Keycloak has no _FILE convention for admin credentials;
      # this is acceptable because: internal network only, demo profile only.
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    volumes:
      - ./keycloak/acme-realm.json:/opt/keycloak/data/import/acme-realm.json:ro
      - ./keycloak/globex-realm.json:/opt/keycloak/data/import/globex-realm.json:ro
    # Keycloak 26 substitutes env placeholders in imported realm JSON.
    # Read the client secret from the compose secret and export it so
    # ${AGG_DEMO_OIDC_CLIENT_SECRET} in the realm files gets replaced.
    entrypoint:
      - /bin/sh
      - -c
      - >-
        export AGG_DEMO_OIDC_CLIENT_SECRET=$$(cat /run/secrets/oidc_client_secret)
        && exec /opt/keycloak/bin/kc.sh start --optimized --import-realm
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q 200"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
